<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">ゴールループ 1周の流れ</title>
  <desc id="desc">上部にゴールとDoDを置き、左から右へ、現在地を証拠で確定する、最大ボトルネックを1件だけ選ぶ、次の一手を1件実行する、旧値から新値へ書き戻す、と進む。DoD未達でAI安全作業が残る限り、最大ボトルネックへ戻ってCONTINUEする。DoD達成かつ書き戻し済ならDONEで抜ける。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152c"/>
      <stop offset="1" stop-color="#10233f"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000814" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1200" height="700" rx="34" fill="url(#bg)"/>

  <text x="60" y="58" fill="#e6f4ff" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="48" font-weight="700">ゴールループ 1周の流れ</text>
  <text x="60" y="106" fill="#8fb3d9" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="38">成果物を作って終わり、にしない</text>

  <rect x="60" y="146" width="1080" height="88" rx="20" fill="#0f2745" stroke="#2a4a78" stroke-width="3"/>
  <text x="92" y="202" fill="#cfe6ff" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="40" font-weight="700">ゴール／DoD ＝ 何が起きれば本当に完了か</text>

  <g filter="url(#shadow)">
    <rect id="done-node" x="60" y="280" width="185" height="160" rx="22" fill="#16304f" stroke="#2f568a" stroke-width="3"/>
    <rect id="bottleneck-node" x="285" y="250" width="355" height="220" rx="26" fill="url(#focus)"/>
    <rect id="next-node" x="680" y="280" width="190" height="160" rx="22" fill="#16304f" stroke="#2f568a" stroke-width="3"/>
    <rect id="writeback-node" x="910" y="280" width="230" height="160" rx="22" fill="#16304f" stroke="#2f568a" stroke-width="3"/>
  </g>

  <text x="152" y="330" text-anchor="middle" fill="#e6f4ff" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="40" font-weight="700">現在地</text>
  <text x="152" y="378" text-anchor="middle" fill="#9fc4e8" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="38">を証拠で</text>
  <text x="152" y="424" text-anchor="middle" fill="#9fc4e8" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="38">確定する</text>

  <text x="462" y="306" text-anchor="middle" fill="#4a0d18" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="38" font-weight="700">いま最大の</text>
  <text x="462" y="366" text-anchor="middle" fill="#ffffff" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="48" font-weight="700">ボトルネック</text>
  <text x="462" y="422" text-anchor="middle" fill="#3d0a13" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="38" font-weight="700">1件だけ選ぶ</text>

  <text x="775" y="330" text-anchor="middle" fill="#e6f4ff" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="40" font-weight="700">次の一手</text>
  <text x="775" y="378" text-anchor="middle" fill="#9fc4e8" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="38">1件だけ</text>
  <text x="775" y="424" text-anchor="middle" fill="#9fc4e8" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="38">実行する</text>

  <text x="1025" y="330" text-anchor="middle" fill="#e6f4ff" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="40" font-weight="700">書き戻す</text>
  <text x="1025" y="386" text-anchor="middle" fill="#7dd3fc" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="38" font-weight="700">旧値 → 新値</text>

  <path d="M250 360 H280" stroke="#7dd3fc" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M645 360 H675" stroke="#7dd3fc" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M875 360 H905" stroke="#7dd3fc" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <path id="loop-arrow" d="M1025 440 V545 H462 V470" stroke="#7dd3fc" stroke-width="5" fill="none" stroke-dasharray="14 10" marker-end="url(#arrow)"/>
  <text x="744" y="522" text-anchor="middle" fill="#7dd3fc" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="38" font-weight="700">AI安全作業が残る限り戻る</text>

  <rect id="continue-node" x="60" y="580" width="640" height="96" rx="20" fill="#0e2b4c" stroke="#2f568a" stroke-width="3"/>
  <text x="92" y="622" fill="#7dd3fc" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="38" font-weight="700">DoD未達 → CONTINUE</text>
  <text x="92" y="664" fill="#9fc4e8" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="38">同じタスク内で回り続ける</text>

  <rect x="740" y="580" width="400" height="96" rx="20" fill="#2c1b26" stroke="#8a4a56" stroke-width="3"/>
  <text x="772" y="622" fill="#ffb3a1" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="38" font-weight="700">DoD達成 → DONE</text>
  <text x="772" y="664" fill="#d6b6ae" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="38">書き戻し済で完了</text>
</svg>
